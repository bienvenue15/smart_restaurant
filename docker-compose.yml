services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartresto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartresto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartresto} -d ${POSTGRES_DB:-smartresto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sr

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartresto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartresto}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env (public site origin)}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD in .env}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SEED_DEMO_DATA: "false"
      MAIL_DISABLE_DELIVERY: ${MAIL_DISABLE_DELIVERY:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Smart Restaurant}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_ENCRYPTION: ${MAIL_SMTP_ENCRYPTION:-tls}
      MAIL_NOTIFY_ADDRESS: ${MAIL_NOTIFY_ADDRESS:-}
      SMS_DISABLE_DELIVERY: ${SMS_DISABLE_DELIVERY:-true}
      SMS_AT_USERNAME: ${SMS_AT_USERNAME:-}
      SMS_AT_API_KEY: ${SMS_AT_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      WHATSAPP_DISABLE_DELIVERY: ${WHATSAPP_DISABLE_DELIVERY:-true}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - sr

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        API_PROXY_TARGET: http://backend:4000
        NUXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE_URL: /api/v1
      NUXT_PUBLIC_I18N_BASE_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      NUXT_API_ORIGIN: http://backend:4000
      API_PROXY_TARGET: http://backend:4000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sr

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sr

volumes:
  postgres_data:
  backend_uploads:
  backend_backups:

networks:
  sr:
    driver: bridge
