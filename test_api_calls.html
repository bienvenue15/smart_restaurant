<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .box { background: #1a1a1a; border: 2px solid #0f0; padding: 20px; margin: 20px 0; }
        pre { background: #000; padding: 10px; border-left: 3px solid #0f0; overflow-x: auto; white-space: pre-wrap; }
        button { padding: 10px 20px; background: #0f0; color: #000; border: none; font-weight: bold; cursor: pointer; margin: 5px; }
        .fail { color: #f00; }
        .pass { color: #0f0; }
    </style>
</head>
<body>
    <h1>🧪 API TEST - Direct Call</h1>
    
    <div class="box">
        <h2>Session Check</h2>
        <button onclick="checkSession()">Check Current Session</button>
        <div id="sessionResult"></div>
    </div>

    <div class="box">
        <h2>API Call Test</h2>
        <button onclick="testNotifications()">Test staff_get_notifications</button>
        <button onclick="testDelayedOrders()">Test staff_check_delayed_orders</button>
        <div id="apiResult"></div>
    </div>

    <script>
        function checkSession() {
            document.getElementById('sessionResult').innerHTML = '<p>⏳ Checking...</p>';
            
            fetch('/restaurant/check_session.php')
                .then(r => r.json())
                .then(data => {
                    let html = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    if (data.staff_logged_in) {
                        html = '<p class="pass">✅ Logged In</p>' + html;
                    } else {
                        html = '<p class="fail">❌ NOT Logged In</p>' + html;
                    }
                    document.getElementById('sessionResult').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('sessionResult').innerHTML = '<p class="fail">Error: ' + e.message + '</p>';
                });
        }

        function testNotifications() {
            document.getElementById('apiResult').innerHTML = '<p>⏳ Testing notifications API...</p>';
            
            fetch('/restaurant/?req=api&action=staff_get_notifications&include_read=0', {
                credentials: 'same-origin'
            })
                .then(async response => {
                    const text = await response.text();
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        data = { raw: text };
                    }
                    
                    let html = '<h3>HTTP ' + response.status + ' ' + response.statusText + '</h3>';
                    html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    
                    if (response.status === 200) {
                        html = '<p class="pass">✅ SUCCESS</p>' + html;
                    } else {
                        html = '<p class="fail">❌ FAILED (Expected 200, got ' + response.status + ')</p>' + html;
                    }
                    
                    document.getElementById('apiResult').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('apiResult').innerHTML = '<p class="fail">Error: ' + e.message + '</p>';
                });
        }

        function testDelayedOrders() {
            document.getElementById('apiResult').innerHTML = '<p>⏳ Testing delayed orders API...</p>';
            
            fetch('/restaurant/?req=api&action=staff_check_delayed_orders', {
                credentials: 'same-origin'
            })
                .then(async response => {
                    const text = await response.text();
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        data = { raw: text };
                    }
                    
                    let html = '<h3>HTTP ' + response.status + ' ' + response.statusText + '</h3>';
                    html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    
                    if (response.status === 200) {
                        html = '<p class="pass">✅ SUCCESS</p>' + html;
                    } else {
                        html = '<p class="fail">❌ FAILED (Expected 200, got ' + response.status + ')</p>' + html;
                    }
                    
                    document.getElementById('apiResult').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('apiResult').innerHTML = '<p class="fail">Error: ' + e.message + '</p>';
                });
        }

        // Auto-check session on load
        window.onload = () => checkSession();
    </script>
</body>
</html>
