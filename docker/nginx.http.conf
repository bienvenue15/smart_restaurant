# HTTP front door used by docker compose (port 80).
# Terminate TLS on the host or a load balancer; see nginx.conf.example.

upstream sr_frontend { server frontend:3000; }
upstream sr_backend  { server backend:4000; }

server {
  listen 80;
  server_name _;
  client_max_body_size 8m;

  location /health {
    proxy_pass http://sr_backend/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://sr_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  location /uploads/ {
    proxy_pass http://sr_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://sr_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
